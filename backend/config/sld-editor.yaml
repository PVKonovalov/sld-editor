server:
  bind: "0.0.0.0:8099"

logging:
  level: info

diagrams:
  # Relative to the backend process's working directory (intended to be run
  # from backend/, e.g. `go run ./cmd/sld-editor -config config/sld-editor.yaml`).
  dir: "../diagrams"

custom_elements:
  # Predefined diagram fragments offered in the Elements palette's "Custom
  # elements" group: every .xsld file directly inside this directory (an
  # ordinary diagram, made and saved in the editor itself) is one entry.
  dir: "../custom-elements"

# Markdown file shown by the sidebar's Help button (converted to HTML on
# every request, so edits show without a restart). Empty disables it. Its
# pictures are served from the images/ folder next to it; a translated guide
# shows x.ru.png in place of x.png when it exists.
user_guide: "assets/USER_GUIDE.md"

xsde:
  # Converter settings for importing Modus .xsde diagrams (File → Load from file…), read on every import. Empty uses
  # xsde2svg's built-in xsde2svg.yml. Both are copies of the files in the xsde2svg repository.
  config: "assets/xsde2svg.yml"
  # A Modus workplace.xml whose color palette the import uses (a document's own colors override it). Empty = each
  # document's own colors only.
  workplace: "assets/workplace.xml"

elements:
  # Element-library XML files, merged in order (a later file's definition of
  # a shape overrides an earlier one's). Add your own library file and list
  # its path here to extend the Elements palette without any code change —
  # see assets/elements/base.xml for the format.
  libraries:
    - "assets/elements/base.xml"

editor:
  # Settings-panel defaults for a diagram that hasn't saved its own.
  grid_spacing: 10
  snap: true
  show_grid: true
  background: "#12161d"
  # Wire jumps also where two buswork wires of the same voltage class cross
  # (Settings → Wire jumps at same-voltage crossings); a new diagram keeps
  # its own copy.
  jump_same_voltage: false

# Default voltage-level -> color palette offered when adding a voltage
# class to a diagram. Editing a diagram's own voltage classes never changes
# this list; it's only ever a starting point for a new one. A CIM import
# whose voltages no entry names offers to append them here (the server
# rewrites this file then, keeping its comments).
voltage_colors:
  - name: "0.4 kV"
    color: "#d2d2d2"
  - name: "6 kV"
    color: "#326400"
  - name: "10 kV"
    color: "#962896"
  - name: "35 kV"
    color: "#965000"
  - name: "110 kV"
    color: "#00a0f0"
  - name: "220 kV"
    color: "#d02020"
  - name: "330 kV"
    color: "#d04040"
  - name: "400 kV"
    color: "#d04040"
  - name: "135 kV"
    color: "#00a0f0"
  - name: "17 kV"
    color: "#962896"
  - name: "11 kV"
    color: "#962896"
  - name: "20 kV"
    color: "#965000"
  - name: "50 kV"
    color: "#965000"
  - name: "33 kV"
    color: "#965000"
  - name: "132 kV"
    color: "#00a0f0"
  - name: "21 kV"
    color: "#965000"
  - name: "10.5 kV"
    color: "#962896"
  - name: "30 kV"
    color: "#965000"
  - name: "210 kV"
    color: "#d02020"

# How close (Euclidean distance in RGB, 0..441) a diagram's voltage class
# color must be to a voltage_colors preset for the editor to offer replacing
# it with the preset (other systems draw the same level in slightly different
# colors: "#d01025" is 16.8 from "220 kV" "#d02020"). Each color matches only
# its nearest preset, so presets closer together than twice this (220/330 kV
# are 45 apart) still never share a color. 0 = exact only.
voltage_color_tolerance: 60

# Global Open/Close/Intermediate/Faulty legend a switching device's state-driven
# fill is drawn from (internal/slddoc.Render's data-fill/data-state
# attributes) and the Properties panel's State dropdown offers. The colors
# are only the starting point: a diagram saved without colors of its own
# takes them into its .xsld (<stateColors>), where Properties > State colors
# changes them for that diagram alone.
state_colors:
  - state: 0
    label: "Open"
    color: "red"
  - state: 1
    label: "Close"
    color: "lawngreen"
  - state: 2
    label: "Intermediate"
    color: "#c9a800"
  # A double-point status reporting both/neither contact (rdss-dms maps the raw Error
  # value here via dms.rdss_dms.transform.double_bit_to_element).
  - state: 3
    label: "Faulty"
    color: "magenta"

# Fault passage indicator colours
fpi_state_colors:
  - state: 0
    label: "Open"
    color: "lawngreen"
  - state: 1
    label: "Close"
    color: "red"
  - state: 2
    label: "Intermediate"
    color: "#c9a800"
  - state: 3
    label: "Faulty"
    color: "magenta"

# Global Service/Normal/Test legend a withdrawable device's own racking
# position is labeled from (internal/slddoc.Render's data-trolley attribute)
# and the Properties panel's Position status dropdown offers — only Breaker/
# Disconnector (withdrawable), shapes 43/49, currently use it. Unlike
# state_colors, position carries no color of its own, only a label — it
# drives a geometric offset (the withdrawable body sliding out of its cell),
# not a fill.
position_states:
  - position: 0
    label: "Service"
  - position: 1
    label: "Normal"
  - position: 2
    label: "Test"

# Default overlay text a FaultPassageIndicator (320003) draws centered on
# itself when its own instance doesn't override it (Element.PropertyText) —
# this shape's own real xsde2svg source draws no text at all, so there's no
# real default to derive; this is purely this project's own long-standing
# convention, admin-configurable per install.
indicators:
  default_fpi_text: "FPI"

# The Elements panel's own collapsible groups, in display order — the
# single source of truth for palette layout (a Symbol in an element
# library file carries no category/grouping of its own any more). Every
# item is a bare xsde2svg ObjectType code — the same vocabulary for every
# kind of entry, never a mix of codes and names: a real equipment shape
# (see elements.libraries), one of 21/22/23/28 (Buswork/Overhead line/
# Cable line/Object link — arms the routing tool's next drawn connector,
# same codes internal/slddoc.Render's own data-type attribute uses), or
# 5/134 (Текст/Text, Прибор цифровой/Digital instrument — this editor's
# own two built-in non-equipment widgets, never a real element.Symbol
# either). A group's own display name is looked up as
# elementCatalog.category.<name> in the frontend's i18n dictionary, the
# same way an element's own name is — falling back to the raw string when
# untranslated.
palette:
  - name: "Wires"
    items: [ "21", "22", "23", "28", "83" ]
  - name: "Busbars"
    items: [ "24" ]
  - name: "Annotations"
    items: [ "3", "2", "4", "113", "302", "319", "11", "335", "5", "292", "1", "16", "310", "9", "312", "313" ]
  - name: "Wiring"
    items: [ "7", "10", "26", "14", "56", "32", "146", "19" ]
  - name: "Switching devices"
    items: [ "41", "43", "42", "162", "164", "163", "399", "49", "50", "51", "76", "44", "175" ]
  - name: "Grounding"
    items: [ "31", "54", "398" ]
  - name: "Transformers"
    items: [ "47", "6" ]
  - name: "Generation"
    items: [ "173", "174", "39", "38" ]
  - name: "Measurement"
    items: [ "34", "55" ]
  - name: "Other equipment"
    items: [ "33", "37", "397", "389", "388", "172", "330001", "330002", "330003", "156", "157", "52", "385", "386", "360" ]
  - name: "Protection"
    items: [ "35", "29", "168", "203", "154", "166" ]
  - name: "Indicators"
    items: [ "106", "320002", "320007", "134", "320003", "320001", "103" ]

# Placement hot keys: pressing the key (without Ctrl/Cmd/Alt) arms that
# palette item, the same as clicking its button; pressing it again disarms it.
# Key: one letter or digit (case doesn't matter; r and m are reserved for
# rotate/mirror). Item: a code that's in the palette above. Mistakes stop the
# server at startup. Leave the section out for no hot keys.
hot_keys:
  t: "47"    # Power transformer
  c: "41"    # Breaker
  d: "162"   # Disconnector
  b: "24"    # Busbar section
  w: "21"    # Buswork
  g: "54"    # Grounder

# CIM export and import: the whole mapping between symbols and CIM classes.
#
# classes (export): a symbol shape code, as in the palette above ("28" is a
# link to object) → the CIM classes an element of that shape can stand for,
# its default first; the others are offered in Properties' CIM class list. A
# symbol not listed here is not exported as equipment (logged at startup, and
# reported in the export's notes). A symbol can only stand for CIM classes the
# export writes alike: switches (Breaker, DisconnectingCircuitBreaker,
# Disconnector, LoadBreakSwitch, GroundDisconnector, Switch, Fuse, Jumper),
# machines (SynchronousMachine, AsynchronousMachine), injections
# (EnergyConsumer, ConformLoad, NonConformLoad, ExternalNetworkInjection,
# EquivalentInjection, EnergySource), shunts (LinearShuntCompensator,
# PetersenCoil), auxiliary equipment (CurrentTransformer,
# PotentialTransformer, SurgeArrester, FaultIndicator, WaveTrap), or its own
# class (busbars BusbarSection, transformers PowerTransformer, Ground,
# SeriesCompensator, StaticVarCompensator).
#
# import: a CIM class → the symbol shape it is drawn with. "Class.variant"
# picks a symbol by the object's attributes: SynchronousMachine.condenser
# (type condenser), SynchronousMachine.motor (type motor or
# motorOrCondenser), AsynchronousMachine.generator (a generator type), and
# LinearShuntCompensator.reactor / NonlinearShuntCompensator.reactor
# (bPerSection < 0); without its row a variant takes its class's. A device of
# a class not listed is drawn where the layout places it as a red box with its
# CIM class written in it, connected to nothing (and listed under Skipped in
# the import log). Lines (ACLineSegment) and links to object are not listed:
# they are connectors. Mistakes stop the server at startup.
cim:
  classes:
    "24":     [ BusbarSection ]                                                    # Busbar section
    "41":     [ Breaker, DisconnectingCircuitBreaker ]                             # Breaker
    "43":     [ Breaker, DisconnectingCircuitBreaker ]                             # Breaker (withdrawable)
    "399":    [ Breaker ]                                                          # Power circuit breaker
    "42":     [ LoadBreakSwitch ]                                                  # Load-break switch
    "162":    [ Disconnector ]                                                     # Disconnector
    "49":     [ Disconnector ]                                                     # Disconnector (withdrawable)
    "44":     [ Disconnector ]                                                     # Knife switch
    "175":    [ Disconnector ]                                                     # 3-position knife switch
    "164":    [ Switch ]                                                           # Sectionalizer
    "50":     [ Switch ]                                                           # Sectionalizer (withdrawable)
    "163":    [ Switch ]                                                           # Short-circuiter without ground
    "51":     [ Switch ]                                                           # Chassis
    "52":     [ Switch ]                                                           # Half-chassis
    "76":     [ Switch, LoadBreakSwitch ]                                          # Starter
    "54":     [ GroundDisconnector ]                                               # Ground switch
    "398":    [ GroundDisconnector ]                                               # Short-circuiter
    "203":    [ Fuse ]                                                             # Fuse
    "154":    [ Fuse ]                                                             # Fuse (withdrawable)
    "166":    [ Fuse ]                                                             # Disconnector-fuse
    "31":     [ Ground ]                                                           # Ground terminal
    "47":     [ PowerTransformer ]                                                 # Power transformer
    "6":      [ PowerTransformer ]                                                 # Booster/voltage regulator
    "173":    [ SynchronousMachine, AsynchronousMachine ]                          # Generator
    "174":    [ SynchronousMachine ]                                               # Synchronous compensator
    "39":     [ SynchronousMachine, AsynchronousMachine ]                          # Synchronous motor
    "37":     [ SeriesCompensator ]                                                # Reactor
    "33":     [ SeriesCompensator ]                                                # Choke coil
    "156":    [ SeriesCompensator ]                                                # Resistor
    "172":    [ LinearShuntCompensator ]                                           # Capacitor bank
    "388":    [ LinearShuntCompensator ]                                           # Capacitor
    "397":    [ LinearShuntCompensator, PetersenCoil ]                             # Reactor (shunt)
    "34":     [ CurrentTransformer ]                                               # Current transformer
    "55":     [ PotentialTransformer ]                                             # Voltage transformer
    "168":    [ SurgeArrester ]                                                    # Surge arrester (grounded)
    "35":     [ SurgeArrester ]                                                    # Surge arrester
    "29":     [ SurgeArrester ]                                                    # Surge arrester
    "320003": [ FaultIndicator ]                                                   # Fault passage indicator
    "389":    [ WaveTrap ]                                                         # Blocking filter
    "330001": [ EnergyConsumer, ConformLoad, NonConformLoad ]                      # Load
    "330002": [ ExternalNetworkInjection, EquivalentInjection, EnergySource ]      # Network infeed
    "330003": [ StaticVarCompensator ]                                             # Static var compensator
    "28":     [ EnergyConsumer, EnergySource ]                                     # Link to object
  import:
    Breaker:                           "41"      # Breaker
    DisconnectingCircuitBreaker:       "41"      # Breaker
    Disconnector:                      "162"     # Disconnector
    LoadBreakSwitch:                   "42"      # Load-break switch
    Switch:                            "164"     # Sectionalizer
    GroundDisconnector:                "54"      # Ground switch
    Fuse:                              "203"     # Fuse
    Ground:                            "31"      # Ground terminal
    BusbarSection:                     "24"      # Busbar section
    PowerTransformer:                  "47"      # Power transformer
    SynchronousMachine:                "173"     # Generator
    SynchronousMachine.condenser:      "174"     # Synchronous compensator
    SynchronousMachine.motor:          "39"      # Synchronous motor
    AsynchronousMachine:               "39"      # Synchronous motor
    AsynchronousMachine.generator:     "173"     # Generator
    SeriesCompensator:                 "37"      # Reactor
    LinearShuntCompensator:            "172"     # Capacitor bank
    LinearShuntCompensator.reactor:    "397"     # Reactor (shunt)
    NonlinearShuntCompensator:         "172"     # Capacitor bank
    NonlinearShuntCompensator.reactor: "397"     # Reactor (shunt)
    PetersenCoil:                      "397"     # Reactor (shunt)
    CurrentTransformer:                "34"      # Current transformer
    PotentialTransformer:              "55"      # Voltage transformer
    SurgeArrester:                     "168"     # Surge arrester (grounded)
    FaultIndicator:                    "320003"  # Fault passage indicator
    WaveTrap:                          "389"     # Blocking filter
    Junction:                          "7"       # Junction point
    EnergyConsumer:                    "330001"  # Load
    ConformLoad:                       "330001"  # Load
    NonConformLoad:                    "330001"  # Load
    ExternalNetworkInjection:          "330002"  # Network infeed
    EquivalentInjection:               "330002"  # Network infeed
    EnergySource:                      "330002"  # Network infeed
    StaticVarCompensator:              "330003"  # Static var compensator
